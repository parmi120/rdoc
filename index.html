<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive RDAC landing page focused entirely on the supplied artwork." />
  <title>RDAC</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --frame: rgba(255,255,255,0.1);
      --glow: rgba(255,255,255,0.08);
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
      --radius: clamp(1rem, 2vw, 2rem);
      --space: clamp(0.75rem, 2vw, 1.5rem);
      --max-width: min(94vw, 1440px);
      --link: #ffffff;
      --link-hover: #d8d8d8;
      --link-underline: rgba(255,255,255,0.55);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space);
      background:
        radial-gradient(circle at top, var(--glow), transparent 28%),
        linear-gradient(180deg, #050505 0%, var(--bg) 100%);
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .image-shell {
      width: var(--max-width);
      border: 1px solid var(--frame);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #111;
      position: relative;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      aspect-ratio: 16 / 9;
    }

    .link-row {
      position: absolute;
      left: 50%;
      bottom: clamp(1rem, 3vw, 2rem);
      transform: translateX(-50%);
      display: flex;
      gap: clamp(0.75rem, 2vw, 1.5rem);
      flex-wrap: wrap;
      justify-content: center;
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .link-row a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-color: var(--link-underline);
      text-underline-offset: 0.18em;
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }

    .link-row a:hover,
    .link-row a:focus-visible {
      color: var(--link-hover);
      text-decoration-color: currentColor;
      outline: none;
    }

    @media (max-width: 640px) {
      :root {
        --max-width: 100%;
      }

      .link-row {
        bottom: clamp(0.75rem, 3vw, 1.25rem);
        gap: 0.75rem;
        width: calc(100% - 1rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .link-row a {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <figure class="image-shell">
      <img src="./rdac-cover.jpg" alt="RDAC cover artwork with silver lettering and a spade symbol on a black background." width="1600" height="900" loading="eager" decoding="async" />

      <figcaption class="link-row" aria-label="Related links">
        <a href="https://example.com/full-volume" target="_blank" rel="noopener noreferrer">full volume</a>
        <a href="https://example.com/v29-music" target="_blank" rel="noopener noreferrer">V29 music</a>
        <a href="https://example.com/amplivibe" target="_blank" rel="noopener noreferrer">amplivibe</a>
      </figcaption>
    </figure>
  </main>
</body>
</html>
