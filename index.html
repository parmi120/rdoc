<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive RDAC landing page for GitHub Pages with three destination buttons." />
  <title>RDAC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c0f;
      --text: #f2f2f2;
      --muted: rgba(255,255,255,.78);
      --display: 'Archivo Black', sans-serif;
      --body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: var(--body);
    }
    .page {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }
    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      z-index: 0;
      opacity: 1;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.03), rgba(0,0,0,.10) 42%, rgba(0,0,0,.24) 72%, rgba(0,0,0,.38));
      pointer-events: none;
      z-index: 1;
    }
    .content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0 clamp(14px, 4vw, 40px);
    }
    .button-row {
      width: min(92vw, 1100px);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: clamp(8px, 1.6vw, 20px);
      align-items: center;
      transform: translateY(33vh);
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: clamp(36px, 6vw, 72px);
      padding: clamp(8px, 1.4vw, 16px);
      border-radius: clamp(16px, 2.4vw, 28px);
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 12px 24px rgba(0,0,0,.24);
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
      overflow: hidden;
    }
    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
      border-color: rgba(255,255,255,.28);
      outline: none;
      box-shadow: 0 16px 30px rgba(0,0,0,.30);
    }
    .btn span {
      position: relative;
      z-index: 1;
      font-family: var(--display);
      text-transform: uppercase;
      text-align: center;
      line-height: .95;
      text-shadow: 0 2px 12px rgba(0,0,0,.25);
      white-space: nowrap;
    }
    .full {
      font-size: clamp(.58rem, .95vw, .9rem);
      letter-spacing: .08em;
      transform: scaleX(1.03) scaleY(.86);
    }
    .v29 {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .v29 .top {
      font-size: clamp(1.05rem, 2.35vw, 2.2rem);
      font-style: italic;
      letter-spacing: -.02em;
    }
    .v29 .sub {
      font-size: clamp(.36rem, .6vw, .62rem);
      letter-spacing: .36em;
      color: var(--muted);
      padding-left: .36em;
      margin-top: .08rem;
    }
    .amp {
      font-size: clamp(.55rem, .9vw, .88rem);
      letter-spacing: .03em;
      transform: rotate(-2deg) scaleX(1.02);
    }
    @media (max-width: 700px) {
      .content { padding: 10px; }
      .button-row { width: 94vw; gap: 7px; transform: translateY(31vh); }
      .btn { min-height: clamp(34px, 11vw, 54px); border-radius: 16px; }
      .full { font-size: clamp(.44rem, 2.2vw, .64rem); }
      .v29 .top { font-size: clamp(.82rem, 3.8vw, 1.25rem); }
      .v29 .sub { font-size: clamp(.28rem, 1.1vw, .4rem); letter-spacing: .22em; }
      .amp { font-size: clamp(.42rem, 2vw, .62rem); }
    }
    @media (max-width: 420px) {
      .button-row { gap: 6px; transform: translateY(29vh); }
      .btn { padding: 7px 7px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="hero" src="rdoc-without-writing.jpg" alt="RDAC logo artwork" width="1366" height="768" loading="eager" decoding="async" />
    <div class="overlay" aria-hidden="true"></div>
    <div class="content">
      <nav class="button-row" aria-label="Main destination buttons">
        <a class="btn" href="https://example.com/full-volume" target="_blank" rel="noopener noreferrer" aria-label="Full Volume">
          <span class="full">Full Volume</span>
        </a>
        <a class="btn" href="https://example.com/v29-music" target="_blank" rel="noopener noreferrer" aria-label="V29 Music">
          <span class="v29"><span class="top">V29</span><span class="sub">Music</span></span>
        </a>
        <a class="btn" href="https://example.com/amplivibe" target="_blank" rel="noopener noreferrer" aria-label="Amplivibe">
          <span class="amp">Amplivibe</span>
        </a>
      </nav>
    </div>
  </main>
</body>
</html>
