<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive RDAC landing page for GitHub Pages with three destination buttons." />
  <title>RDAC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c0f;
      --text: #f2f2f2;
      --muted: rgba(255,255,255,.78);
      --display: 'Archivo Black', sans-serif;
      --body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: var(--body);
    }
    .page {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }
    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.04), rgba(0,0,0,.12) 45%, rgba(0,0,0,.3) 75%, rgba(0,0,0,.48));
      pointer-events: none;
      z-index: 1;
    }
    .content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: clamp(16px, 4vw, 40px);
    }
    .button-row {
      width: min(92vw, 1100px);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: clamp(8px, 2vw, 24px);
      align-items: center;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: clamp(44px, 8vw, 92px);
      padding: clamp(10px, 1.8vw, 20px);
      border-radius: clamp(18px, 3vw, 34px);
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 30px rgba(0,0,0,.28);
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
      overflow: hidden;
    }
    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
      border-color: rgba(255,255,255,.28);
      outline: none;
      box-shadow: 0 18px 36px rgba(0,0,0,.34);
    }
    .btn span {
      position: relative;
      z-index: 1;
      font-family: var(--display);
      text-transform: uppercase;
      text-align: center;
      line-height: .95;
      text-shadow: 0 2px 12px rgba(0,0,0,.25);
      white-space: nowrap;
    }
    .full {
      font-size: clamp(.7rem, 1.2vw, 1.05rem);
      letter-spacing: .08em;
      transform: scaleX(1.05) scaleY(.86);
    }
    .v29 {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .v29 .top {
      font-size: clamp(1.25rem, 3vw, 2.9rem);
      font-style: italic;
      letter-spacing: -.02em;
    }
    .v29 .sub {
      font-size: clamp(.45rem, .8vw, .75rem);
      letter-spacing: .38em;
      color: var(--muted);
      padding-left: .38em;
      margin-top: .12rem;
    }
    .amp {
      font-size: clamp(.68rem, 1.15vw, 1rem);
      letter-spacing: .03em;
      transform: rotate(-2deg) scaleX(1.03);
    }
    @media (max-width: 700px) {
      .content { padding: 14px; }
      .button-row { width: 94vw; gap: 8px; }
      .btn { min-height: clamp(40px, 13vw, 62px); border-radius: 18px; }
      .full { font-size: clamp(.5rem, 2.6vw, .78rem); }
      .v29 .top { font-size: clamp(.9rem, 4.8vw, 1.5rem); }
      .v29 .sub { font-size: clamp(.3rem, 1.3vw, .46rem); letter-spacing: .22em; }
      .amp { font-size: clamp(.48rem, 2.2vw, .72rem); }
    }
    @media (max-width: 420px) {
      .button-row { gap: 6px; }
      .btn { padding: 8px 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="hero" src="rdoc-without-writing.jpg" alt="RDAC logo artwork" width="1366" height="768" loading="eager" decoding="async" />
    <div class="overlay" aria-hidden="true"></div>
    <div class="content">
      <nav class="button-row" aria-label="Main destination buttons">
        <a class="btn" href="https://example.com/full-volume" target="_blank" rel="noopener noreferrer" aria-label="Full Volume">
          <span class="full">Full Volume</span>
        </a>
        <a class="btn" href="https://example.com/v29-music" target="_blank" rel="noopener noreferrer" aria-label="V29 Music">
          <span class="v29"><span class="top">V29</span><span class="sub">Music</span></span>
        </a>
        <a class="btn" href="https://example.com/amplivibe" target="_blank" rel="noopener noreferrer" aria-label="Amplivibe">
          <span class="amp">Amplivibe</span>
        </a>
      </nav>
    </div>
  </main>
</body>
</html>
