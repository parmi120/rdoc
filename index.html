<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive RDAC landing page with invisible clickable hotspots on the artwork." />
  <title>RDAC</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --frame: rgba(255,255,255,0.1);
      --glow: rgba(255,255,255,0.08);
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
      --radius: clamp(1rem, 2vw, 2rem);
      --space: clamp(0.75rem, 2vw, 1.5rem);
      --max-width: min(94vw, 1440px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space);
      background:
        radial-gradient(circle at top, var(--glow), transparent 28%),
        linear-gradient(180deg, #050505 0%, var(--bg) 100%);
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .image-shell {
      width: var(--max-width);
      border: 1px solid var(--frame);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #111;
      position: relative;
      line-height: 0;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      aspect-ratio: 16 / 9;
      pointer-events: none;
      user-select: none;
    }

    .hotspot {
      position: absolute;
      display: block;
      background: transparent;
      border: 0;
      text-decoration: none;
      z-index: 2;
      cursor: pointer;
      outline: none;
    }

    .hotspot:focus-visible {
      outline: 2px solid rgba(255,255,255,0.7);
      outline-offset: 2px;
    }

    /* Desktop positions - adjust these if needed */
    .hotspot.full-volume {
      left: 12.2%;
      top: 43.5%;
      width: 16.5%;
      height: 7.2%;
    }

    .hotspot.v29-music {
      left: 39.3%;
      top: 43.5%;
      width: 13.5%;
      height: 7.2%;
    }

    .hotspot.amplivibe {
      left: 62.7%;
      top: 43.5%;
      width: 15.8%;
      height: 7.2%;
    }

    @media (max-width: 1100px) {
      .hotspot.full-volume {
        left: 11.5%;
        top: 43%;
        width: 18%;
        height: 7.5%;
      }

      .hotspot.v29-music {
        left: 38%;
        top: 43%;
        width: 15%;
        height: 7.5%;
      }

      .hotspot.amplivibe {
        left: 61.5%;
        top: 43%;
        width: 17%;
        height: 7.5%;
      }
    }

    @media (max-width: 640px) {
      :root {
        --max-width: 100%;
      }

      .hotspot.full-volume {
        left: 10.5%;
        top: 42.2%;
        width: 19%;
        height: 8.5%;
      }

      .hotspot.v29-music {
        left: 36.5%;
        top: 42.2%;
        width: 17%;
        height: 8.5%;
      }

      .hotspot.amplivibe {
        left: 60.5%;
        top: 42.2%;
        width: 18%;
        height: 8.5%;
      }
    }

    @media (max-width: 420px) {
      .hotspot.full-volume {
        left: 10%;
        top: 41.8%;
        width: 20%;
        height: 9%;
      }

      .hotspot.v29-music {
        left: 35.5%;
        top: 41.8%;
        width: 18%;
        height: 9%;
      }

      .hotspot.amplivibe {
        left: 59.5%;
        top: 41.8%;
        width: 19%;
        height: 9%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <figure class="image-shell">
      <img
        src="./rdac-cover.jpg"
        alt="RDAC cover artwork with silver lettering and a spade symbol on a black background."
        width="1600"
        height="900"
        loading="eager"
        decoding="async"
      />

      <a
        class="hotspot full-volume"
        href="https://example.com/full-volume"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Full volume"
      ></a>

      <a
        class="hotspot v29-music"
        href="https://example.com/v29-music"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="V29 music"
      ></a>

      <a
        class="hotspot amplivibe"
        href="https://example.com/amplivibe"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="AmpliVibe"
      ></a>
    </figure>
  </main>
</body>
</html>
